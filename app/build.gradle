plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

// Huawei Ads (Petal) slot ID for the AppGallery build: -PHMS_INTERSTITIAL_ID=... or ads.properties.
// Until the real slots are set the hms build falls back to Huawei's public test slots.
def hmsAdsProps = new Properties()
def hmsAdsPropsFile = rootProject.file('ads.properties')
if (hmsAdsPropsFile.exists()) hmsAdsPropsFile.withInputStream { hmsAdsProps.load(it) }
def hmsAdId = { String key, String fallback -> ((project.findProperty(key) ?: hmsAdsProps.getProperty(key)) ?: fallback).toString() }
def HMS_TEST_INTERSTITIAL_ID = 'testb4znbuh3n2'
def HMS_INTERSTITIAL_ID = hmsAdId('HMS_INTERSTITIAL_ID', HMS_TEST_INTERSTITIAL_ID)

android {
    namespace 'com.drnoob.datamonitor'
    compileSdk 36

    defaultConfig {
        applicationId "com.bumbumapps.datamonitorpro"
        minSdk 24
        targetSdk 36
        versionCode 13
        versionName '2.0.1'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // play = Google Play (AdMob + UMP), hms = Huawei AppGallery (Huawei Ads, no Google Mobile Services).
    flavorDimensions = ['store']
    productFlavors {
        play {
            dimension 'store'
        }
        hms {
            dimension 'store'
            resValue 'string', 'hms_interstitial_id', HMS_INTERSTITIAL_ID
            resValue 'string', 'hms_test_interstitial_id', HMS_TEST_INTERSTITIAL_ID
        }
    }

    buildTypes {
        debug {
            // Google test ads in debug builds.
            manifestPlaceholders = [admobAppId: "ca-app-pub-3940256099942544~3347511713"]
            resValue "string", "admob_interstitial_id", "ca-app-pub-3940256099942544/1033173712"
        }
        release {
            manifestPlaceholders = [admobAppId: "ca-app-pub-8444865753152507~7067962845"]
            resValue "string", "admob_interstitial_id", "ca-app-pub-8444865753152507/9776503779"
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.navigation:navigation-fragment:2.9.5'
    implementation 'androidx.navigation:navigation-ui:2.9.5'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation "com.github.skydoves:progressview:1.1.2"
    implementation 'com.airbnb.android:lottie:6.6.7'
    implementation 'com.github.antonKozyriatskyi:CircularProgressIndicator:1.3.0'
    implementation 'fr.bmartel:jspeedtest:1.32.1'
    implementation 'io.ipinfo:ipinfo-api:2.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation "androidx.multidex:multidex:2.0.1"

    //ads
    playImplementation 'com.google.android.gms:play-services-ads:25.5.0'
    playImplementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    hmsImplementation 'com.huawei.hms:ads-lite:13.4.91.301'
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-crashlytics'
}
